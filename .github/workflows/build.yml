name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: >
          dotnet publish src/StorageCat.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:ContinuousIntegrationBuild=true

      - name: Compute SHA-256
        id: sha
        shell: pwsh
        run: |
          $dir = "src/bin/Release/net8.0-windows/win-x64/publish"
          $exes = @(Get-ChildItem -Path $dir -Filter *.exe -File -ErrorAction Stop)
          if ($exes.Count -ne 1) {
            Write-Error "Expected exactly 1 exe in $dir, found $($exes.Count): $($exes.Name -join ', ')"
            exit 1
          }
          $exe = $exes[0]
          Write-Host "Hashing $($exe.Name) ($($exe.Length) bytes)"
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "hash=$hash" >> $env:GITHUB_OUTPUT
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StorageCat-${{ github.ref_name }}
          path: ${{ steps.sha.outputs.exe }}
