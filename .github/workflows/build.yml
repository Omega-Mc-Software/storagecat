name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: >
          dotnet publish src/StorageCat.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:ContinuousIntegrationBuild=true

      - name: Compute SHA-256
        id: sha
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/bin/Release/net8.0-windows/win-x64/publish/StorageCat.exe
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "hash=$hash" >> $env:GITHUB_OUTPUT
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StorageCat-${{ github.ref_name }}
          path: ${{ steps.sha.outputs.exe }}
